[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "relief-workshop"
version = "1.0.0"
description = "Offline polarimeter slope calibration, MAP plate planning and milling ledger"
requires-python = ">=3.10"

[project.scripts]
relief-workshop = "relief_workshop.cli:main"

[tool.setuptools.packages.find]
include = ["relief_workshop*"]
