[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "guide-studio"
version = "1.0.0"
description = "Reproducible bilingual referent proofreading and wall/voice-pen recording optimizer"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
guide-studio = "guide_studio.cli:main"

[tool.setuptools]
packages = ["guide_studio"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
