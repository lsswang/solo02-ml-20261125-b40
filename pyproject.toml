[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soundbench"
version = "1.0.0"
description = "Dependency-free two-speaker/two-zone synthetic sound exhibition workbench"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
soundbench = "soundbench.cli:main"

[tool.setuptools]
packages = ["soundbench"]
